</style><header>POSTER STUDIO <small>Local demo · fictional event</small></header><aside><p>ONE POSTER. THREE MOODS.</p><h1>Make your<br>next meetup<br>stand out.</h1><p>Choose a theme.<br>Watch the poster change.</p></aside><section class="tools"><h2>Choose a theme</h2><button id="neutral" class="active"><i class="swatch" style="background:#b6bcae"></i>Neutral</button><button id="ocean"><i class="swatch" style="background:#215dff"></i>Ocean</button><button id="sunset"><i class="swatch" style="background:#f15c42"></i>Sunset</button><p id="state">Neutral selected</p></section><article class="poster" id="poster"><div class="kicker">MAKER SESSIONS / 01</div><h2>MAKE<br>SOMETHING<br>GOOD.</h2><div class="art"></div><div class="date">SATURDAY · 10 AM<br>IDEAS INTO ACTION</div></article><div id="pointer"></div><script>

</script></html>
